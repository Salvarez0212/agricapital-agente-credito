name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint, typecheck y tests
    runs-on: ubuntu-latest
    services:
      # BD real para los tests de integración de la API (credenciales solo de CI).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agricapital
          POSTGRES_PASSWORD: agricapital
          POSTGRES_DB: agricapital
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agricapital"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # Job aparte: un aviso nuevo en una dependencia se ve en rojo sin mezclarse con los
  # tests. Solo dependencias de producción (lo que corre con datos reales).
  auditoria:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm audit --omit=dev --audit-level=high
