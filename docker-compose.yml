services:
  db:
    image: postgres:16-alpine
    container_name: agricapital-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: agricapital
      POSTGRES_PASSWORD: agricapital
      POSTGRES_DB: agricapital
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agricapital']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
