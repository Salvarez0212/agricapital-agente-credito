services:
  db:
    image: postgres:16-alpine
    container_name: agricapital-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: agricapital
      POSTGRES_PASSWORD: agricapital
      POSTGRES_DB: agricapital
    ports:
      # Solo desde esta máquina: con '5432:5432' Docker publica el puerto en todas las
      # interfaces y cualquiera en la misma red podría conectarse con estas credenciales.
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agricapital']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
